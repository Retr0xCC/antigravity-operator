# syntax=docker/sandbox-kit:2
schemaVersion: "2"
kind: sandbox
name: media-operator
version: "1.0.0"
displayName: Antigravity Media Operator
description: Autonomous media management agent with zero-copy hardlinks, Muxpress remuxing, and hardware AV1/HEVC compression.

sandbox:
  image: ghcr.io/retr0xcc/antigravity-operator:latest
  entrypoint:
    - agy
  command:
    default:
      - --dangerously-skip-permissions

agentInstructions:
  filename: INSTRUCTIONS.md

credentials:
  - service: google
    description: Gemini API key for Antigravity's headless API-key mode
    apiKey:
      name: GEMINI_API_KEY
      proxyManaged: true
      inject:
        - domain: generativelanguage.googleapis.com
          header: x-goog-api-key
          format: "%s"

permissions:
  network:
    allow:
      - accounts.google.com
      - oauth2.googleapis.com
      - www.googleapis.com
      - lh3.googleusercontent.com
      - aicode.googleapis.com
      - cloudcode-pa.googleapis.com
      - daily-cloudcode-pa.googleapis.com
      - generativelanguage.googleapis.com
      - antigravity.google
      - antigravity.google.com
      - antigravity-unleash.goog
      - play.googleapis.com
      - safebrowsing.googleapis.com
      - www.gstatic.com
      - antigravity-cli-auto-updater-974169037036.us-central1.run.app
      - storage.googleapis.com
      - raw.githubusercontent.com
      - github.com
      - api.github.com
      - objects.githubusercontent.com
      # Media Metadata Providers (TMDb / IMDb / TVDb / Wikipedia / Cyclopedia)
      - api.themoviedb.org
      - www.themoviedb.org
      - image.tmdb.org
      - api.thetvdb.com
      - api4.thetvdb.com
      - thetvdb.com
      - www.thetvdb.com
      - imdb.com
      - www.imdb.com
      - v2.sg.media-imdb.com
      - v3.sg.media-imdb.com
      - en.wikipedia.org
      - ru.wikipedia.org
      - api.wikimedia.org
      - upload.wikimedia.org
      - openlibrary.org
      - covers.openlibrary.org

environment:
  variables:
    BROWSER: xdg-open
    AGY_CLI_DISABLE_AUTO_UPDATE: "true"

setup:
  startup:
    - command:
        - sh
        - -c
        - |
          set -e
          cfg="$HOME/.gemini/antigravity-cli/settings.json"
          mkdir -p "$(dirname "$cfg")"
          [ -s "$cfg" ] || echo '{}' > "$cfg"
          if [ "${SBX_CRED_GOOGLE_MODE:-none}" = apikey ]; then
            jq '.modelProvider = "gemini"' "$cfg" > "$cfg.tmp"
          else
            jq 'del(.modelProvider)' "$cfg" > "$cfg.tmp"
          fi
          mv "$cfg.tmp" "$cfg"
      user: "1000"
      description: Select Gemini API-key mode only when a Google credential is available
